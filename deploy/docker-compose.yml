name: analytics

services:
  postgres:
    image: postgres:16-alpine
    container_name: analytics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: analytics-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-analytics}
      DB_USER: ${POSTGRES_USER:-analytics}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-32-bytes-minimum-secret}
      VISITOR_SALT: ${VISITOR_SALT:-change-me-visitor-salt}
      INGESTION_ANONYMIZE_IP: ${INGESTION_ANONYMIZE_IP:-false}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*],https://127.0.0.1:[*]}
      RETENTION_EVENTS_MONTHS: ${RETENTION_EVENTS_MONTHS:-144}
      GEOIP_DB: ${GEOIP_DB:-/app/geoip/GeoLite2-City.mmdb}
      SPRING_PROFILES_ACTIVE: prod
      LIQUIBASE_CONTEXTS: prod
    volumes:
      - ./geoip:/app/geoip:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: analytics-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5180}:80"
      - "${WEB_PORT_SECURE:-443}:443"
    volumes:
      # Certificado de origem do Cloudflare (origin.crt / origin.key) — não versionado.
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # Atualiza a base GeoLite2 periodicamente. Opcional: só roda com --profile geoip.
  # Requer GEOIPUPDATE_ACCOUNT_ID e GEOIPUPDATE_LICENSE_KEY no deploy/.env.
  geoip:
    image: maxmindinc/geoipupdate:latest
    container_name: analytics-geoip
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: ${GEOIPUPDATE_EDITION_IDS:-GeoLite2-City}
      GEOIPUPDATE_FREQUENCY: ${GEOIPUPDATE_FREQUENCY:-24}
    volumes:
      - ./geoip:/usr/share/GeoIP
    restart: unless-stopped

volumes:
  postgres_data:
