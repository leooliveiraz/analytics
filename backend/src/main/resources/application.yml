spring:
  application:
    name: analytics-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analytics}
    username: ${DB_USER:analytics}
    password: ${DB_PASSWORD:analytics}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:prod}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    issuer: analytics-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}
  ingestion:
    visitor-salt: ${VISITOR_SALT:dev-visitor-salt-change-me}
    filter-bots: ${INGESTION_FILTER_BOTS:true}
    rate-limit:
      enabled: ${INGESTION_RATE_LIMIT_ENABLED:true}
      capacity: ${INGESTION_RATE_LIMIT_CAPACITY:240}
      window: ${INGESTION_RATE_LIMIT_WINDOW:1m}
  geoip:
    database-path: ${GEOIP_DB:}
  retention:
    events-months: ${RETENTION_EVENTS_MONTHS:12}

logging:
  level:
    root: INFO
    com.analytics: ${LOG_LEVEL:INFO}
    liquibase: INFO
